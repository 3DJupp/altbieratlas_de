# ============================================================
# Altbieratlas — Cloudflare Workers Konfiguration
# ============================================================
# Diese Datei enthält KEINE konkreten Betreiber-Daten. Alle
# Site-Werte (Autor, Impressum, GA4-ID, Turnstile-Site-Key …)
# werden ausschließlich im Cloudflare-Dashboard gepflegt:
#
#   Workers & Pages → <dein-worker-name> → Settings
#     → Variables and Secrets
#
# Dank `keep_vars = true` bleiben Dashboard-Werte auch bei
# jedem `wrangler deploy` erhalten.
#
# Welche Variablen der Worker erwartet, steht in der README
# Abschnitt „Konfiguration".
# ============================================================

name = "altbieratlas"
main = "src/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Im Dashboard gesetzte Plaintext-Variablen NICHT bei jedem Deploy
# löschen. WICHTIG: muss ein Top-Level-Key bleiben — steht er nach
# einer [table]/[[table]]-Überschrift, schluckt TOML ihn als deren
# Property und wrangler ignoriert ihn (so geschehen → Turnstile-
# Site-Key wurde bei jedem Deploy entfernt). Secrets bleiben ohnehin
# immer erhalten.
keep_vars = true

# Binäre Assets: TTF-Font für OG-Image-Generator
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# --- Statische Dateien ----------------------------------------
# Der Worker beantwortet /api/* selbst und delegiert alles andere
# ans ASSETS-Binding.
[assets]
directory = "./public"
binding = "ASSETS"
# Worker muss für alle Requests laufen, damit /impressum.html serverseitig
# mit Betreiberdaten angereichert werden kann (Server-Side-Injection).
run_worker_first = true
# Ohne "none" leitet das ASSETS-Binding /ranglisten.html → /ranglisten um,
# auch bei internen env.ASSETS.fetch()-Aufrufen → Redirect-Schleife.
# Mit "none" serviert ASSETS exakt den angeforderten Pfad ohne Manipulation.
html_handling = "none"

# --- D1-Datenbank ---------------------------------------------
# Platzhalter werden von scripts/deploy.sh via sed ersetzt.
# Deploy-Command im CF-Dashboard: bash scripts/deploy.sh
# Benötigte Build-Umgebungsvariablen: database_id, database_name
# Ersteinrichtung: `npx wrangler d1 create <dein-name>`
[[d1_databases]]
binding       = "DB"
database_name = "REPLACE_WITH_YOUR_D1_NAME"
database_id   = "REPLACE_WITH_YOUR_D1_ID"

# --- R2: Stil-Logos -----------------------------------------
# Bucket für hochgeladene Stil-Logos (PNG/WebP/SVG, max 2 MB).
# Ersteinrichtung: `npx wrangler r2 bucket create altbieratlas-logos`
# Logo-Auslieferung: GET /logos/:key → Worker liest aus LOGOS-Binding.
[[r2_buckets]]
binding     = "LOGOS"
bucket_name = "altbieratlas-logos"

# --- Cron: täglicher Admin-Digest ----------------------------
# Sendet einmal täglich eine Zusammenfassung aller neuen
# Beiträge an ADMIN_EMAIL (siehe Secrets unten).
# Zeitzone: UTC → 07:00 UTC = 08:00 / 09:00 Uhr Berlin.
[triggers]
crons = ["0 7 * * *"]

# --- Observability --------------------------------------------
# Spiegelt die Dashboard-Einstellungen wider, damit Wrangler sie
# beim Deploy nicht überschreibt (Cloudflare warnt sonst).
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# --- Konfiguration: Dashboard --------------------------------
#
# Bewusst KEINE [vars] in dieser Datei. Alle Werte werden im
# Dashboard gepflegt. Deploy-feste Einzelwerte liegen als SECRET
# (Secrets werden von `wrangler deploy` nie gelöscht), der Rest
# als Plaintext-Variable SITE_CONFIG (überlebt Deploys dank des
# korrekt am Top-Level platzierten keep_vars = true).
#
# ── Einzel-Secrets (Dashboard → Variables and Secrets) ────────
#   TURNSTILE_SITE_KEY    — öffentlicher Turnstile-Site-Key (als Secret,
#                           damit deploy-fest; Worker liefert ihn via /api/config).
#   TURNSTILE_SECRET_KEY  — serverseitiger Turnstile-Key.
#   GA4_MEASUREMENT_ID    — GA4-Mess-ID (G-XXXX…); fehlt sie, kein Tracking.
#   UNTAPPD_CLIENT_ID     — Untappd-App-Client-ID.
#   UNTAPPD_CLIENT_SECRET — Untappd-App-Secret.
#   RESEND_API_KEY        — API-Key von resend.com (für alle Mails).
#   ADMIN_EMAIL           — Empfänger des täglichen Beitrags-Digests.
#
#   INITIAL_ADMIN  (nur für die Ersteinrichtung, danach entfernen!)
#     Legt beim ersten Request automatisch einen Admin-User an,
#     sofern noch keine Admin-User in der Datenbank existieren.
#     Format (JSON-String):
#     {"username":"admin","password":"sicheres-passwort","email":"deine@email.de"}
#     Setzen: wrangler secret put INITIAL_ADMIN
#     Nach dem ersten Login im CF-Dashboard als Secret wieder löschen.
#
# ── Sammel-Plaintext-Variable: SITE_CONFIG ────────────────────
#
#   SITE_CONFIG  (JSON-String, im Dashboard als Plaintext-Variable)
#
#   Beispiel (nur noch nicht-sensitive Sammelwerte):
#   {
#     "contactEmail":     "deine@email.de",
#     "priceSizes":       [0.2, 0.25, 0.4, 0.5],
#     "highlightedSizes": [0.25, 0.5],
#     "requireModeration": true,
#     "siteUrl":          "https://altbieratlas.de",
#     "resendFrom":       "Altbieratlas <noreply@altbieratlas.de>",
#     "author":    { "name": "Dein Name", "github": "https://github.com/..." },
#     "impressum": { "owner": "Vor- und Nachname", "address": "…", "email": "…" }
#   }
#
#   priceSizes:       Dezimalzahlen ohne Einheit (UI ergänzt „l").
#                     Standard: [0.2, 0.25, 0.4, 0.5]
#   highlightedSizes: Teilmenge von priceSizes, die in Ranglisten
#                     hervorgehoben wird. 1–n Werte möglich.
#   requireModeration: true = alle Beiträge landen in der Queue.
#                      Standard: true
#   siteUrl:          Öffentliche URL, z. B. für E-Mail-Links.
#   resendFrom:       Absenderadresse für alle Mails via Resend.
#   author/impressum: Können auch im Admin-Panel (D1) gepflegt werden,
#                     das Vorrang vor SITE_CONFIG hat.
# ============================================================
