# ============================================================
# Altbieratlas — Cloudflare Workers Konfiguration
# ============================================================
# Diese Datei enthält KEINE konkreten Betreiber-Daten. Alle
# Site-Werte (Autor, Impressum, GA4-ID, Turnstile-Site-Key …)
# werden ausschließlich im Cloudflare-Dashboard gepflegt:
#
#   Workers & Pages → altbieratlas → Settings
#     → Variables and Secrets
#
# Dank `keep_vars = true` bleiben Dashboard-Werte auch bei
# jedem `wrangler deploy` erhalten.
#
# Welche Variablen der Worker erwartet, steht in der README
# Abschnitt „Konfiguration".
# ============================================================

name = "altbieratlas"
main = "src/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Alle im Dashboard gesetzten Variablen und Secrets bleiben bei
# jedem Deploy erhalten. Ohne dieses Flag würde `wrangler deploy`
# sie mit dem (hier absichtlich leeren) Datei-Zustand überschreiben.
keep_vars = true

# --- Statische Dateien ----------------------------------------
# Der Worker beantwortet /api/* selbst und delegiert alles andere
# ans ASSETS-Binding.
[assets]
directory = "./public"
binding = "ASSETS"

# --- D1-Datenbank ---------------------------------------------
# Einmalig anlegen:  npx wrangler d1 create altbieratlas
# Danach die ausgegebene ID unten einsetzen und committen —
# die ID ist nicht geheim, nur projektspezifisch.
[[d1_databases]]
binding       = "DB"
database_name = "altbieratlas"
database_id   = "REPLACE_WITH_YOUR_D1_ID"

# --- Absichtlich KEINE [vars] in dieser Datei -----------------
#
# Alles wird im Dashboard gepflegt. Der Worker liest env.*
# direkt zur Laufzeit; fehlende Werte werden vom Frontend
# sauber als „nicht gesetzt" behandelt (z. B. kein Social-Icon,
# kein GA4-Tracking, Turnstile-Platzhalter).
#
# Erwartete Variablen (im Dashboard setzen):
#   CONTACT_EMAIL        — für Nominatim-User-Agent
#   GA4_MEASUREMENT_ID   — GA4-ID (G-XXXXXXXXXX), leer = aus
#   AUTHOR_NAME          — Name im Footer
#   AUTHOR_GITHUB        — GitHub-URL
#   AUTHOR_LINKEDIN      — LinkedIn-URL
#   AUTHOR_WEBSITE       — Website (optional)
#   IMPRESSUM_OWNER      — Betreiber (§ 5 TMG)
#   IMPRESSUM_ADDRESS    — Postanschrift
#   IMPRESSUM_EMAIL      — Kontakt-E-Mail
#   TURNSTILE_SITE_KEY   — öffentlicher Turnstile-Key
#
# Secrets (mit `wrangler secret put …` setzen — nie committen):
#   TURNSTILE_SECRET_KEY
# ============================================================
