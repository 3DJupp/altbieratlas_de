<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#b57a3a" />
<title>Ort · Altbieratlas</title>
<link rel="alternate" type="application/atom+xml" title="Altbieratlas – Termine" href="/api/events/feed.xml" />
<meta name="description" content="Altbier-Brauerei im Altbieratlas — Preise, Öffnungszeiten und Informationen." />
<link rel="canonical" href="https://altbieratlas.de/ort" id="meta-canonical" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Altbieratlas" />
<meta property="og:title" content="Ort · Altbieratlas" id="meta-og-title" />
<meta property="og:description" content="Altbier-Brauerei im Altbieratlas." id="meta-og-desc" />
<meta property="og:url" content="https://altbieratlas.de/ort" id="meta-og-url" />
<meta property="og:image" content="https://altbieratlas.de/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<meta property="og:locale" content="de_DE" />
<meta property="og:locale:alternate" content="en_US" />

<link rel="preconnect" href="https://unpkg.com" crossorigin>

      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<link rel="stylesheet" href="/styles.css" />
<style>
/* Ortsseite: Ortskopf, Getränkekarte, Sorten als Liste (Design System „Altbieratlas“) */
.brewery-hero { padding: 32px 0; border-bottom: 1px solid var(--rule-strong); }
.breadcrumb { display: flex; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--ink-muted); margin-bottom: 10px; }
.breadcrumb a { color: var(--ink-muted); border-bottom-color: var(--rule-strong); }
.breadcrumb a:hover { color: var(--ink); }
.brewery-head { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.brewery-title { font-size: clamp(2.25rem, 5vw, 3.5rem); line-height: 1.07; font-weight: 600; }
.brewery-meta { display: flex; align-items: center; gap: 6px 14px; margin-top: 12px; color: var(--ink-soft); font-size: 15px; flex-wrap: wrap; }
.brewery-meta span { display: inline-flex; align-items: center; gap: 6px; }
.brewery-meta .dot { width: 1px; height: 14px; border-radius: 0; background: var(--rule-strong); }
.brewery-meta a { display: inline-flex; align-items: center; gap: 4px; }
/* Aktueller Preis: hinter einer Haarlinie statt in einer Karte */
.price-hero { flex: 0 0 auto; min-width: 220px; padding-left: 24px; border-left: 1px solid var(--rule-strong); margin-top: 30px; }
.price-hero .label { font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.price-hero .big { font-family: var(--font-display); font-size: 44px; line-height: 48px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 4px; }
.price-hero .size { font-size: 15px; color: var(--ink-soft); }
.price-hero .small { font-size: 14px; color: var(--ink-muted); }

.ort-photo-wrap { flex: 1 1 520px; min-width: 0; display: flex; align-items: flex-start; gap: 20px; }
.ort-avatar { width: 88px; height: 88px; flex-shrink: 0; margin-top: 30px; }
.ort-avatar.has-logo { border-radius: 50%; overflow: hidden; background: #fff7e8; border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; }
.ort-avatar.has-logo img { width: 100%; height: 100%; object-fit: contain; padding: 8px; display: block; }
.ort-avatar.logo-on-light { background: #fff7e8; }
.ort-avatar.logo-on-dark  { background: #2a211a; }
.ort-title-wrap { flex: 1; min-width: 0; }
.ort-photo { width: 100%; max-height: 300px; object-fit: cover; display: block; border-radius: var(--radius); }

.grid-2col { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; padding-top: 40px; padding-bottom: 48px; }
.about { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
.about p { font-size: 18px; line-height: 1.55; color: var(--ink-soft); margin: 0; }
.about .ort-lineage { font-size: 16px; font-weight: 600; color: var(--ink); }
.about .ort-address { display: flex; gap: 8px; align-items: flex-start; font-size: 16px; }
.about .ort-address .icon { margin-top: 2px; color: var(--ink-muted); }
.detail-map { height: 320px; border-radius: var(--radius); overflow: hidden; cursor: pointer; background: var(--map-ground); }
.maps-open-btn {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg-card); color: var(--ink) !important;
  font-size: 13px; font-weight: 600;
  padding: 6px 10px; border-radius: var(--radius);
  border: none; box-shadow: var(--shadow);
  text-decoration: none !important; margin: 8px; white-space: nowrap;
}

/* Sorten als Liste: Glas oder Logo, Name, Text, Werte rechts */
.sorts { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.sort { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.style-logo { width: 48px; height: 48px; object-fit: contain; }
.sort h3 { font-size: 20px; line-height: 26px; }
.sort p { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
.sort .nums { color: var(--ink-muted); font-size: 14px; line-height: 26px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.price-history { padding-top: 8px; padding-bottom: 56px; }
.price-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 48px; }
.ort-hours h3 { font-size: 20px; margin: 0 0 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ort-hours .menu-row { padding: 7px 0; }
.ort-hours .menu-name, .ort-hours .menu-price { font-weight: 400; }
.ort-hours .hours-note { font-size: 14px; margin: 8px 0 0; }
.ort-hours .hours-src { font-size: 14px; color: var(--ink-muted); margin: 8px 0 0; }
.hours-chip { font-size: 13px; }
.hours-chip.open { color: var(--ok); }
.hours-chip.closed { color: var(--ruby); }
.offers-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin: 12px 0 32px; }
.offer-card { padding: 16px 18px; }
.offer-card h3 { font-size: 18px; margin: 8px 0 4px; }
.offer-card p { font-size: 14px; margin: 4px 0; }
.offer-card .offer-when { font-size: 14px; color: var(--ink-muted); }
.offer-badge { margin-right: 6px; }
.offer-code { font-variant-numeric: tabular-nums; font-size: 14px; padding: 2px 8px; border: 1px dashed var(--rule-strong); border-radius: var(--radius-sm); }
.chart { width: 100%; height: 220px; border-top: 1px solid var(--rule-strong); }
.chart svg { width: 100%; height: 100%; display: block; }
.chart .grid-line { stroke: var(--rule); stroke-width: 1; }
.chart .area { display: none; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.chart .axis-label { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 12px; fill: var(--ink-muted); }

.action-bar { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.untappd-bar, .google-rating-bar {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 14px; color: var(--ink-soft); margin-top: 16px; border-bottom: none;
}
.untappd-bar .ut-logo { font-weight: 700; color: var(--ink); }
.google-rating-bar .gr-attr, .untappd-bar a { font-size: 14px; color: var(--ink-muted); }

@media (max-width: 900px) {
  .grid-2col { grid-template-columns: 1fr; gap: 28px; padding-top: 24px; padding-bottom: 32px; }
  .price-hero { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 0; width: 100%; }
  .ort-avatar { width: 56px; height: 56px; margin-top: 0; }
  .ort-photo-wrap { flex-direction: column; gap: 12px; }
  .brewery-title { font-size: clamp(2rem, 9vw, 2.5rem); }
  .sort { grid-template-columns: 40px minmax(0, 1fr); }
  .sort .nums { grid-column: 2; text-align: left; line-height: 20px; }
}
</style>
</head>
<body>
<div class="page">
  <div id="shell-banner" hidden></div>
  <div id="shell-header"></div>

  <main id="brewery-root" data-ssr="0">
    <div class="container" style="padding:80px 24px">
      <p style="color:var(--ink-muted)" data-i18n="common.loading">Lade…</p>
    </div>
  </main>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>
</div>

<!-- Leaflet erst hier: im <head> blockiert es das Rendern der Textinhalte. -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/data.js"></script>
<script src="/api-client.js"></script>
<script src="/shell.js"></script>
<script>
renderShell({ activeNav: "map" });

const params = new URLSearchParams(location.search);
// Kanonisch ist /ort/<slug>; ?id= bleibt als Fallback (Mock-Modus, Altlinks).
const pathSlug = decodeURIComponent((location.pathname.match(/^\/ort\/([^/]+)/) || [])[1] || "");
const id = pathSlug || params.get("id") || "uerige";
const root = document.getElementById("brewery-root");
// Muss mit citySlug() in src/routes.js übereinstimmen.
const citySlug = (name) => String(name || "").toLowerCase()
  .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
// Überschrift über den Sorten: kommt aus dem Ortstyp (venue_types.header_*); ohne Angabe
// (z. B. Mock-Modus) „gebraut“ nur bei Produzenten, sonst „ausgeschenkt“ bzw. „erhältlich“.
function stylesTitle(b, l) {
  const h = b.typeHeader && (b.typeHeader[l] || b.typeHeader.de);
  if (h) return h;
  if (['brewery', 'brewpub'].includes(b.type)) return window.t('brewery.stylesTitle');
  if (['kiosk', 'supermarket', 'beverage_store', 'handel'].includes(b.type)) return window.t('brewery.stylesTitleRetail');
  return window.t('brewery.stylesTitleServed');
}
// Hat der Worker die Seite schon gerendert, sind Meta-Tags und JSON-LD gesetzt.
const isSsr = root.dataset.ssr === "1";

(async () => {
  let result, stylesRes;
  try {
    [result, stylesRes] = await Promise.all([
      window.AtlasAPI.getBrewery(id),
      window.AtlasAPI.listStyles(),
    ]);
  } catch (e) {
    console.error(e);
    root.innerHTML = `
      <div class="container" style="padding:80px 24px">
        <h1>${window.t("common.error")}</h1>
        <p style="color:var(--ink-muted)">${e.message || "Datenabruf fehlgeschlagen."}</p>
        <p><a href="/">← ${window.t("common.back")}</a></p>
      </div>`;
    return;
  }

  if (!result || result.error || !result.brewery) {
    root.innerHTML = `
      <div class="container" style="padding:80px 24px">
        <h1>${window.t("brewery.notFound")}</h1>
        <p><a href="/">${window.t("brewery.backToMap")}</a></p>
      </div>`;
    return;
  }

  const b = result.brewery;
  const prices = result.prices || [];
  const allStyles = stylesRes.styles || [];
  const styles = (b.styles || [])
    .map((sid) => allStyles.find((s) => s.id === sid))
    .filter(Boolean);

  // Größen kommen als "0.25", "0.25l" oder Legacy "0,25l" — numerisch vergleichen.
  // Preise sind nach Datum absteigend sortiert: erste Meldung je Größe ist die jüngste.
  // Anzeige: 0,25 l, sonst die kleinste gemeldete Größe (wie auf der Stadtseite).
  const sizeNum = (s) => parseFloat(String(s).replace(",", ".").replace(/\s*l$/i, ""));
  const latest = prices.find((p) => Math.abs(sizeNum(p.size) - 0.25) < 0.001)
              || prices.reduce((best, p) => (!best || sizeNum(p.size) < sizeNum(best.size) - 0.001 ? p : best), null);
  const lang = window.__atlasLang;
  const styleName = (id) => (id && allStyles.find((s) => s.id === id)?.name) || "";

  const SOURCE_KEYS = { "vor Ort": "source.vorOrt", "Beitrag": "source.beitrag" };
  function translateSource(src) {
    if (!src) return "";
    const key = SOURCE_KEYS[src];
    return key ? window.t(key) : src;
  }

  // Den SSR-Titel (mit Preis) nicht überschreiben — Google wertet den
  // gerenderten Titel. Nur ohne SSR oder für die englische Fassung neu setzen.
  if (!isSsr || lang === "en") document.title = window.atlasTitle(`${b.name} · Altbier in ${b.city}`);

  // SEO: Meta-Tags dynamisch befüllen — nur ohne SSR, sonst doppeltes JSON-LD
  if (!isSsr) (function() {
    const pageUrl = `https://altbieratlas.de/ort/${encodeURIComponent(b.id)}`;
    const desc = (b.description && (b.description.de || b.description.en))
      ? (b.description.de || b.description.en).slice(0, 155).replace(/\s+\S*$/, "") + "…"
      : `${b.name} — Altbier ${window.t ? window.t("type." + b.type) : b.type} in ${b.city} im Altbieratlas.`;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", desc);
    const canonical = document.getElementById("meta-canonical");
    if (canonical) canonical.setAttribute("href", pageUrl);
    const ogUrl = document.getElementById("meta-og-url");
    if (ogUrl) ogUrl.setAttribute("content", pageUrl);
    const ogTitle = document.getElementById("meta-og-title");
    if (ogTitle) ogTitle.setAttribute("content", `${b.name} · Altbieratlas`);
    const ogDesc = document.getElementById("meta-og-desc");
    if (ogDesc) ogDesc.setAttribute("content", desc);
    const twTitle = document.getElementById("meta-tw-title");
    if (twTitle) twTitle.setAttribute("content", `${b.name} · Altbieratlas`);
    const twDesc = document.getElementById("meta-tw-desc");
    if (twDesc) twDesc.setAttribute("content", desc);
    // JSON-LD LocalBusiness
    const ld = {"@context":"https://schema.org","@type":"LocalBusiness","name":b.name,"url":pageUrl};
    if (b.address) ld.address = {"@type":"PostalAddress","streetAddress":b.address,"addressLocality":b.city,"addressCountry":b.country||"DE"};
    if (b.lat && b.lon) ld.geo = {"@type":"GeoCoordinates","latitude":b.lat,"longitude":b.lon};
    if (b.website) ld.sameAs = b.website;
    // Preise als Menu/MenuItem+Offer — identisch zum SSR-Pfad (serveOrt in
    // src/routes.js). Kein Product: ein Product-Knoten ohne eigene "offers"
    // (der Preis hing am umgebenden Offer) ist für Google ein unvollständiges
    // Produkt-Snippet — "offers, review oder aggregateRating fehlt".
    // Jüngste Meldung je Größe, nicht die ganze Preis-Historie.
    const ldPrices = [];
    const ldSeenSize = new Set();
    for (const p of prices.filter((x) => x.price)
                          .sort((x, y) => String(y.date || "").localeCompare(String(x.date || "")))) {
      const key = String(p.size || "");
      if (ldSeenSize.has(key)) continue;
      ldSeenSize.add(key);
      ldPrices.push(p);
    }
    if (ldPrices.length > 0) {
      ld.hasMenu = {
        "@type": "Menu",
        "hasMenuSection": {
          "@type": "MenuSection",
          "name": "Altbier",
          "hasMenuItem": ldPrices.map((p) => ({
            "@type": "MenuItem",
            "name": `Altbier${p.size ? " " + p.size : ""}`,
            "offers": {
              "@type": "Offer",
              "price": Number(p.price).toFixed(2),
              "priceCurrency": "EUR"
            }
          }))
        }
      };
    }
    const s = document.createElement("script");
    s.type = "application/ld+json";
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  })();

  const typeLabel = window.t("type." + b.type);

  // Avatar: Logo oder Initialen. Das Foto ist kein Logo und steht separat im „Über"-Block.
  function initials(str) {
    const words = (str || "").match(/\p{L}+/gu) || [];
    if (words.length === 0) return "?";
    return (words.length >= 2 ? words[0][0] + words[1][0] : words[0].slice(0, 2)).toUpperCase();
  }
  // Ohne Logo: Bierdeckel mit Initialen (Platzhalter aus dem Design System)
  const matHtml = window.atlasMat(b.short || b.name, 88);
  const avatarHtml = b.logoUrl
    ? `<img src="${b.logoUrl}" alt="" data-logo-backdrop onerror="const a=this.parentNode;a.classList.remove('has-logo','logo-on-dark','logo-on-light');a.innerHTML=a.dataset.mat">`
    : matHtml;

  // Getränkekarte: Datum und Quelle links, Punktlinie, Größe, Preis rechts
  function priceRows() {
    return prices.slice(0, 5).map((p) => `
      <li class="menu-row${p.status === 'pending' ? ' is-pending' : ''}">
        <span class="menu-name" style="font-weight:400">${window.formatDate(p.date)}</span>
        <span class="menu-sub">${[translateSource(p.source), styleName(p.styleId)].filter(Boolean).join(' · ')}</span>
        <span class="menu-leader"></span>
        <span class="menu-size">${window.formatSize(p.size)}</span>
        <span class="menu-price">${window.formatEuro(p.price)}</span>
      </li>`).join('') || `<li class="menu-empty">${window.t("brewery.noPriceReports")}</li>`;
  }

  root.innerHTML = `
    <section class="brewery-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/" data-i18n="nav.map">Karte</a>
          <span aria-hidden="true">/</span> <a href="/stadt/${citySlug(b.city)}">${b.city}</a>
        </nav>
        <div class="brewery-head">
          <div class="ort-photo-wrap">
            <div class="ort-avatar${b.logoUrl ? ' has-logo' : ''}" data-mat="${matHtml.replace(/"/g, '&quot;')}">${avatarHtml}</div>
            <div class="ort-title-wrap">
              <h1 class="brewery-title">${b.name}</h1>
              <div class="brewery-meta">
                <span id="b-status" class="tag ${b.verified ? 'verified' : 'pending'}">${b.verified ? window.atlasIcon('check') : ''}<span>${b.verified ? window.t('common.verified') : window.t('common.pending')}</span></span>
                <span id="b-type">${typeLabel}</span>
                ${b.isHistorical ? `<span class="tag historical" data-i18n="brewery.historical">${window.t('brewery.historical')}</span>` : ''}
                ${b.highlighted && !b.isHistorical ? `<span class="tag partner" title="${window.t('offer.partnerHint')}">${window.atlasIcon('star')}<span data-i18n="offer.partnerShort">${window.t('offer.partnerShort')}</span></span>` : ''}
                <span class="dot"></span>
                <span>${b.city}${b.country && b.country !== 'DE' ? ' · ' + b.country : ''}</span>
                ${b.founded ? `<span class="dot"></span><span id="b-since">${window.t("rank.sinceYear")}${b.founded}</span>` : ''}
                ${window.atlasSafeHref(b.website) ? `<span class="dot"></span><a href="${window.atlasSafeHref(b.website)}" target="_blank" rel="noopener">${(() => { try { return new URL(window.atlasSafeHref(b.website)).hostname.replace(/^www\./, ''); } catch { return 'Website'; } })()} ${window.atlasIcon('external', { size: 16 })}</a>` : ''}
              </div>
            </div>
          </div>
          ${latest ? `
            <div class="price-hero">
              <div class="label" data-i18n="brewery.currentPrice">${window.t("brewery.currentPrice")}</div>
              <div class="big" id="b-price-val">${window.formatEuro(latest.price)}</div>
              <div class="size" id="b-price-label">${window.formatSize(latest.size)}${styleName(latest.styleId) ? ` ${styleName(latest.styleId)}` : ""}</div>
              <div class="small" id="b-price-date">${window.t("brewery.reported")}${window.formatDate(latest.date)}</div>
            </div>
          ` : ''}
        </div>
      </div>
    </section>

    <section class="container grid-2col">
      <div class="about">
        ${b.photoUrl ? `<img class="ort-photo" src="${b.photoUrl}" alt="${b.name}" loading="lazy" onerror="this.remove()">` : ''}
        <h2 class="sr-only" data-i18n="brewery.about">Über</h2>
        <p id="b-description">${(b.description && (b.description[lang] || b.description.de)) || ''}</p>
        ${b.successor ? `<p class="ort-lineage"><span data-i18n="brewery.successor">${window.t('brewery.successor')}</span>: <a href="/ort/${encodeURIComponent(b.successor.id)}">${b.successor.name} →</a></p>` : ''}
        ${b.predecessors && b.predecessors.length ? `<p class="ort-lineage"><span data-i18n="brewery.predecessors">${window.t('brewery.predecessors')}</span>: ${b.predecessors.map((p) => `<a href="/ort/${encodeURIComponent(p.id)}">${p.name}</a>`).join(', ')}</p>` : ''}
        ${b.address ? `<p class="ort-address">${window.atlasIcon('pin')}<span>${b.address}</span></p>` : ''}
        <div id="hours-section"></div>
      </div>
      <div>
        <div class="detail-map" id="detail-map"></div>
      </div>
    </section>

    ${styles.length ? `
      <section class="container" style="padding-bottom:40px">
        <h2 style="margin-top:8px" id="b-styles-title">${stylesTitle(b, lang)}</h2>
        <ul class="sorts">
          ${styles.map((s) => `
            <li class="sort">
              ${s.logoUrl
                ? `<img src="${s.logoUrl}" alt="" class="style-logo" onerror="this.outerHTML=window.atlasGlass(48)">`
                : window.atlasGlass(48)}
              <div>
                <h3><a href="/sorten#${encodeURIComponent(s.id)}" style="color:var(--ink);border:none">${s.name}</a></h3>
                <p id="tasting-${s.id}">${(s.tasting && (s.tasting[lang] || s.tasting.de)) || ''}</p>
              </div>
              <div class="nums">
                ${[s.abv != null ? `<span id="abv-${s.id}">${window.formatABV(s.abv)}</span>` : '', s.ibu != null ? `${s.ibu} IBU` : ''].filter(Boolean).join(' · ')}
              </div>
            </li>
          `).join('')}
        </ul>
      </section>
    ` : ''}

    <div class="container" id="offers-section"></div>
    <div class="container" id="google-rating-section"></div>
    <div class="container" id="untappd-section" style="padding-bottom:20px"></div>

    <section class="container price-history">
      <div class="price-cols">
        <div>
          <div class="menu-head"><h2 data-i18n="brewery.recentPrices">Jüngste Preismeldungen</h2></div>
          <ul class="menu price-log">${priceRows()}</ul>
          <div class="action-bar" style="margin-top:20px">
            <a class="btn btn-primary" href="/beitragen?typ=preis&brauerei=${b.id}">${window.atlasIcon('pencil')}<span data-i18n="brewery.addPrice">Preis melden</span></a>
          </div>
        </div>
        <div>
          <div class="menu-head"><h2 data-i18n="brewery.pricesOverTime">Preis über Zeit</h2>${latest ? `<span class="note">${window.formatSize(latest.size)}</span>` : ''}</div>
          <div class="chart" id="chart"></div>
        </div>
      </div>

      <div class="action-bar">
        <a class="btn" href="/beitragen?typ=korrektur&brauerei=${b.id}" data-i18n="brewery.reportIssue">Korrektur einreichen</a>
        <button class="btn btn-ghost" id="share-btn" type="button" data-i18n="brewery.share">Teilen</button>
        <a class="btn btn-ghost" href="/" data-i18n="common.back">Zurück</a>
      </div>
    </section>
  `;

  // i18n re-apply für die frisch injected nodes
  window.setLang(window.__atlasLang);

  // Detail-Karte
  const dm = L.map('detail-map', {
    center: b.coords, zoom: 14, zoomControl: false, scrollWheelZoom: false,
  });
  window.atlasTileLayer(dm);
  L.marker(b.coords, {
    icon: L.divIcon({
      className: '',
      html: b.logoUrl
        ? `<div class="atlas-pin ${b.type} has-logo"><img src="${b.logoUrl}" alt="" onerror="const p=this.parentNode;p.classList.remove('has-logo','logo-on-dark','logo-on-light');p.style.margin='13px';this.remove()"></div>`
        : `<div class="atlas-pin selected ${b.type}"></div>`,
      iconSize: b.logoUrl ? [48, 48] : [20, 20], iconAnchor: b.logoUrl ? [24, 24] : [10, 10],
    }),
  }).addTo(dm);
  dm.getPane("markerPane").querySelectorAll(".has-logo img").forEach(window.atlasLogoBackdrop);
  root.querySelectorAll("img[data-logo-backdrop]").forEach(window.atlasLogoBackdrop);

  // "Open in Maps" — Leaflet control + click handler
  const mapsUrl = window.atlasMapsLink(b);
  const MapsBtn = L.Control.extend({
    onAdd() {
      const a = L.DomUtil.create('a', 'maps-open-btn');
      a.href = mapsUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<span data-i18n="brewery.openInMaps">${window.t('brewery.openInMaps')}</span>${window.atlasIcon('external', { size: 16 })}`;
      L.DomEvent.disableClickPropagation(a);
      return a;
    },
  });
  new MapsBtn({ position: 'bottomright' }).addTo(dm);
  dm.on('click', () => window.open(mapsUrl, '_blank', 'noopener'));

  // ============ Chart ============
  function drawChart() {
    const targetSize = latest ? sizeNum(latest.size) : 0.25;
    // Nur eine Sorte pro Kurve, sonst springt sie zwischen z. B. Alt und Alkoholfrei
    const targetStyle = latest ? latest.styleId || null : null;
    const series = prices
      .filter((p) => Math.abs(sizeNum(p.size) - targetSize) < 0.001)
      .filter((p) => !targetStyle || !p.styleId || p.styleId === targetStyle)
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date));
    const container = document.getElementById('chart');
    if (!container) return;
    if (series.length < 2) {
      container.innerHTML = `<p style="color:var(--ink-muted);font-size:13px">${window.t("brewery.insufficientChart")}</p>`;
      return;
    }
    const W = container.clientWidth || 600;
    const H = 220;
    const pad = { t: 20, r: 30, b: 30, l: 48 };
    const innerW = W - pad.l - pad.r;
    const innerH = H - pad.t - pad.b;

    const xs = series.map((s) => new Date(s.date).getTime());
    const ys = series.map((s) => s.price);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys) - 0.2, yMax = Math.max(...ys) + 0.2;
    const x = (v) => pad.l + ((v - xMin) / Math.max(1, xMax - xMin)) * innerW;
    const y = (v) => pad.t + (1 - (v - yMin) / (yMax - yMin)) * innerH;

    const linePath = series.map((s, i) =>
      (i ? 'L' : 'M') + x(new Date(s.date).getTime()) + ' ' + y(s.price)
    ).join(' ');
    const areaPath = linePath
      + ' L ' + x(xMax) + ' ' + (pad.t + innerH)
      + ' L ' + x(xMin) + ' ' + (pad.t + innerH) + ' Z';

    const gridLines = [];
    const steps = 4;
    for (let i = 0; i <= steps; i++) {
      const v = yMin + (yMax - yMin) * (i / steps);
      gridLines.push(`<line class="grid-line" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" />`);
      gridLines.push(`<text class="axis-label" x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end">${window.formatEuro(v)}</text>`);
    }

    const xTicks = series.filter((_, i) => i === 0 || i === series.length - 1 || i === Math.floor(series.length / 2));
    const xLabels = xTicks.map((s) => {
      const d = new Date(s.date);
      return `<text class="axis-label" x="${x(d.getTime())}" y="${H - 8}" text-anchor="middle">${d.toLocaleDateString(window.atlasLocale(), { month: 'short', year: '2-digit' })}</text>`;
    }).join('');

    const dots = series.map((s) =>
      `<circle class="dot" cx="${x(new Date(s.date).getTime())}" cy="${y(s.price)}" r="3.5" />`
    ).join('');

    container.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${gridLines.join('')}
        <path class="area" d="${areaPath}" />
        <path class="line" d="${linePath}" />
        ${dots}
        ${xLabels}
      </svg>
    `;
  }
  drawChart();
  window.addEventListener('resize', drawChart);

  function updateBreweryTexts() {
    const l = window.__atlasLang;
    const elStatus = document.getElementById('b-status');
    if (elStatus) {
      elStatus.className = `tag ${b.verified ? 'verified' : 'pending'}`;
      elStatus.textContent = b.verified ? window.t('common.verified') : window.t('common.pending');
    }
    const elType = document.getElementById('b-type');
    if (elType) elType.textContent = window.t('type.' + b.type);
    const elStylesTitle = document.getElementById('b-styles-title');
    if (elStylesTitle) elStylesTitle.textContent = stylesTitle(b, l);
    const elSince = document.getElementById('b-since');
    if (elSince) elSince.textContent = window.t('rank.sinceYear') + b.founded;
    if (latest) {
      const elLabel = document.getElementById('b-price-label');
      if (elLabel) elLabel.textContent = window.formatSize(latest.size)
        + (styleName(latest.styleId) ? ' ' + styleName(latest.styleId) : '');
      const elVal = document.getElementById('b-price-val');
      if (elVal) elVal.textContent = window.formatEuro(latest.price);
      const elDate = document.getElementById('b-price-date');
      if (elDate) elDate.textContent = window.t('brewery.reported') + window.formatDate(latest.date);
    }
    const elDesc = document.getElementById('b-description');
    if (elDesc) elDesc.textContent = (b.description && (b.description[l] || b.description.de)) || '';
    styles.forEach((s) => {
      const el = document.getElementById('tasting-' + s.id);
      if (el) el.textContent = (s.tasting && (s.tasting[l] || s.tasting.de)) || '';
      if (s.abv != null) {
        const elAbv = document.getElementById('abv-' + s.id);
        if (elAbv) elAbv.textContent = window.formatABV(s.abv);
      }
    });
    const log = document.querySelector('.price-log');
    if (log) log.innerHTML = priceRows();
  }
  document.addEventListener('atlas:lang-changed', () => { updateBreweryTexts(); drawChart(); });

  // Google-Bewertung (aus dem höchstens 30 Tage alten Cache, kommt mit /api/breweries/:id).
  // Nur Sterne-Schnitt und Anzahl, keine Review-Texte; „Google" bleibt sichtbar.
  function renderGoogleRating() {
    const sec = document.getElementById("google-rating-section");
    const g = b.googleRating;
    if (!sec || !g || g.rating == null || b.isHistorical) return;
    const loc = window.atlasLocale ? window.atlasLocale() : "de-DE";
    const rating = Number(g.rating).toLocaleString(loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const count = g.userRatingCount != null ? Number(g.userRatingCount).toLocaleString(loc) : null;
    sec.innerHTML = `
      <a class="google-rating-bar" href="${mapsUrl}" target="_blank" rel="noopener">
        ${window.atlasStars(g.rating)} <span class="gr-stars">${rating}</span>
        ${count ? `<span class="gr-count">(${count} ${window.t("brewery.googleRatingCount")})</span>` : ""}
        <span class="gr-attr">${window.t("brewery.googleRatingOn")}</span>
      </a>`;
  }
  renderGoogleRating();
  document.addEventListener('atlas:lang-changed', renderGoogleRating);

  // Öffnungszeiten: eigene, sonst Googles aus dem 30-Tage-Cache („laut Google“).
  // „Jetzt geöffnet“ rechnet in Europe/Berlin (window.atlasHours in shell.js).
  function renderHours() {
    const sec = document.getElementById("hours-section");
    const H = window.atlasHours;
    const own = b.openingHours;
    const hours = b.isHistorical ? null : (own || b.googleOpeningHours?.days || null);
    if (!sec || !hours) return;
    const t = window.t;
    const l = window.__atlasLang;
    const now = H.berlinNow();
    const st = H.status(hours, now);
    const chip = !st ? "" : st.open
      ? `<span class="tag hours-chip open">${t("brewery.openNow")}${st.until ? " · " + t("brewery.openUntil").replace("{t}", st.until) : ""}</span>`
      : `<span class="tag hours-chip closed">${t("brewery.closedNow")}${st.opensAt ? " · " + t("brewery.opensAt").replace("{t}", st.opensAt) : ""}</span>`;
    const rows = H.DAYS.filter((d) => d in hours).map((d) => `
      <li class="menu-row${d === now.day ? " is-today" : ""}"><span class="menu-name">${t("day." + d)}</span><span class="menu-leader"></span><span class="menu-price">${H.formatDay(hours[d], t("brewery.closedDay"))}</span></li>`).join("");
    const note = own && b.openingHoursNote ? (b.openingHoursNote[l] || b.openingHoursNote.de || "") : "";
    const src = own
      ? (b.openingHoursChecked ? t("brewery.hoursChecked").replace("{date}", window.formatDate(b.openingHoursChecked)) : "")
      : t("brewery.hoursGoogle");
    sec.innerHTML = `
      <div class="ort-hours">
        <h3>${t("brewery.hours")} ${chip}</h3>
        <ul class="menu">${rows}</ul>
        ${note ? `<p class="hours-note">${note.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</p>` : ""}
        ${src ? `<p class="hours-src">${src}</p>` : ""}
      </div>`;
  }
  renderHours();
  document.addEventListener('atlas:lang-changed', renderHours);

  // Aktionen und Coupons: laufende zuerst, abgelaufene fallen weg (Berliner Zeit).
  // Coupons stammen aus Kooperationen und sind deshalb als Partner-Aktion markiert.
  function renderOffers() {
    const sec = document.getElementById("offers-section");
    if (!sec) return;
    const t = window.t;
    const l = window.__atlasLang;
    const list = window.atlasOffers.sort(result.offers || []);
    if (!list.length || b.isHistorical) { sec.innerHTML = ""; return; }
    const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const when = (o) => {
      const days = o.weekdays ? o.weekdays.map((d) => t("day." + d)).join(", ") : t("offer.daily");
      const time = o.timeFrom ? `${o.timeFrom}–${o.timeTo}` : t("offer.allDay");
      const valid = o.validFrom && o.validFrom > window.atlasHours.berlinNow().date
        ? " · " + t("offer.from").replace("{date}", window.formatDate(o.validFrom))
        : o.validUntil ? " · " + t("offer.until").replace("{date}", window.formatDate(o.validUntil)) : "";
      return `${days} · ${time}${valid}`;
    };
    sec.innerHTML = `
      <div class="eyebrow">${t("offer.eyebrow")}</div>
      <div class="offers-list">${list.map(({ o, s }) => `
        <article class="card offer-card${s === "now" ? " is-now" : ""}">
          ${s === "now" ? `<span class="tag verified offer-badge">${t("offer.now")}</span>` : s === "today" ? `<span class="tag offer-badge">${t("offer.today")}</span>` : ""}
          ${o.kind === "coupon" ? `<span class="tag partner offer-badge">${t("offer.partner")}</span>` : ""}
          <h3>${esc(o.title[l] || o.title.de)}</h3>
          ${o.description ? `<p>${esc(o.description[l] || o.description.de)}</p>` : ""}
          ${o.code ? `<p>${t("offer.code")} <span class="offer-code">${esc(o.code)}</span></p>` : ""}
          <p class="offer-when">${esc(when(o))}</p>
        </article>`).join("")}
      </div>`;
  }
  renderOffers();
  document.addEventListener('atlas:lang-changed', renderOffers);

  // Status nach Minutenwechsel aktuell halten, falls die Seite länger offen bleibt
  setInterval(() => { renderHours(); renderOffers(); }, 60 * 1000);

  // Untappd-Daten nachladen (fire & forget — zeigt nur wenn verfügbar)
  fetch(`/api/untappd/brewery/${encodeURIComponent(b.id)}`)
    .then((r) => r.ok ? r.json() : null)
    .then((ut) => {
      if (!ut || !ut.available || !ut.found) return;
      const sec = document.getElementById("untappd-section");
      if (!sec) return;
      const stars = ut.rating != null ? window.atlasStars(ut.rating) : null;
      const href = ut.slug ? `https://untappd.com/brewery/${ut.slug}` : "https://untappd.com";
      sec.innerHTML = `
        <div class="untappd-bar">
          <span class="ut-logo">Untappd</span>
          ${stars ? `<span class="ut-stars">${stars}</span>` : ""}
          ${ut.rating != null ? `<span>${ut.rating.toFixed(2)} / 5</span>` : ""}
          ${ut.beerCount != null ? `<span style="color:var(--ink-muted)">${ut.beerCount} Biere</span>` : ""}
          <a href="${href}" target="_blank" rel="noopener">auf Untappd →</a>
        </div>`;
    })
    .catch(() => {});

  // Share-Button
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      const shareUrl  = location.href;
      const shareText = `${b.name} — ${window.t('brewery.shareTitle')}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: shareText, url: shareUrl });
          return;
        } catch { /* aborted or not supported */ }
      }
      try {
        await navigator.clipboard.writeText(shareUrl);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = shareUrl;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const orig = shareBtn.textContent;
      shareBtn.textContent = window.t('brewery.shareCopied');
      shareBtn.disabled = true;
      setTimeout(() => {
        shareBtn.textContent = orig;
        shareBtn.disabled = false;
      }, 2000);
    });
  }
})();
</script>
</body>
</html>
