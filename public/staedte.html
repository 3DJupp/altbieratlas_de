<link rel="stylesheet" href="/styles.css" />
<style>
.city-hero { padding: 60px 0 40px; border-bottom: 1px solid var(--rule); }
.city-hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 500; max-width: 18ch; margin: 8px 0 0; }
.city-hero .lede { color: var(--ink-soft); font-size: 18px; max-width: 60ch; margin-top: 18px; line-height: 1.65; }
.city-back { display: inline-block; margin-top: 22px; font-size: 13px; color: var(--ink-muted); }
.city-section { padding: 60px 0; border-bottom: 1px solid var(--rule); }
.city-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.city-card {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--bg-card); border: 1px solid var(--rule); border-radius: var(--radius-lg);
  padding: 24px; text-decoration: none; color: inherit;
  transition: border-color .15s, transform .1s, box-shadow .15s;
}
.city-card:hover { border-color: var(--copper); transform: translateY(-2px); box-shadow: var(--shadow); }
.city-card .cc-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; color: var(--ink); line-height: 1.2; }
.city-card .cc-type { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.city-empty { color: var(--ink-muted); padding: 16px 0; }
</style>
</head>
<body>
<div class="page">
  <div id="shell-banner" hidden></div>
  <div id="shell-header"></div>

  <section class="city-hero">
    <div class="container">
      <h1 data-i18n="cities.h1">Altbier nach Stadt</h1>
      <p class="lede" data-i18n="cities.lede">Alle Städte mit Altbier-Orten im Atlas. Jede Stadtseite listet Brauereien, Ausschank und Händler mit den aktuellen Preisen.</p>
      <a class="city-back" href="/" data-i18n="city.backToMap">← Zur Karte</a>
    </div>
  </section>

  <section class="city-section">
    <div class="container">
      <div class="city-grid" id="cities-list" data-ssr="0">
        <p class="city-empty" data-i18n="common.loading">Lade…</p>
      </div>
    </div>
  </section>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>
</div>

<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/data.js"></script>
<script src="/api-client.js"></script>
<script src="/shell.js"></script>
<script>
renderShell({ activeNav: "" });

const fillTpl = (key, vars) => {
  let s = window.t(key);
  for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
};

const countLabel = (n) => n === 0 ? window.t("cities.historicalOnly")
  : n === 1 ? window.t("cities.one") : fillTpl("city.count", { n });

// Der Worker rendert die Liste serverseitig vor; der Client übernimmt sie
// (Sprache) bzw. baut sie im Mock-Modus aus der Config.
function paint() {
  document.title = window.atlasTitle(window.t("cities.h1"));
  const cities = window.ATLAS_CONFIG.cities || [];
  const el = document.getElementById("cities-list");
  if (!cities.length) {
    if (el.dataset.ssr !== "1") el.innerHTML = `<p class="city-empty">${window.t("cities.empty")}</p>`;
    return;
  }
  el.innerHTML = cities.map((c) => `<a class="city-card" href="/stadt/${encodeURIComponent(c.slug)}">
      <span class="cc-name">${c.city}</span>
      <span class="cc-type">${countLabel(c.current ?? c.count)}</span>
    </a>`).join("");
}

paint();
document.addEventListener("atlas:config-ready", paint);
document.addEventListener("atlas:lang-changed", paint);
</script>
</body>
</html>
