<meta property="og:url" content="https://altbieratlas.de/magazin" />
<meta property="og:image" content="https://altbieratlas.de/og-image.png" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles.css" />
<style>
.art-hero { padding: 40px 0 26px; border-bottom: 1px solid var(--rule); }
.breadcrumb {
  display: flex; gap: 8px; flex-wrap: wrap;
  font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-muted); margin-bottom: 14px;
}
.breadcrumb a { border: none; color: var(--ink-muted); }
.breadcrumb a:hover { color: var(--copper); }
.art-title { font-size: clamp(1.8rem, 4.5vw, 2.8rem); font-weight: 500; max-width: 24ch; margin-bottom: 14px; }
.art-meta { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-muted); }
.art-draft { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px; background: #9b1f1f; color: #fff; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.art-teaser { font-size: 19px; line-height: 1.6; color: var(--ink-soft); max-width: 62ch; margin: 18px 0 0; }
.art-main { padding-top: 32px; padding-bottom: 40px; }
.art-related { max-width: 68ch; margin-top: 36px; padding: 20px 24px; background: var(--bg-card); border: 1px solid var(--rule); border-radius: var(--radius-lg); }
.art-related h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 10px; }
.art-related ul { margin: 0; padding-left: 1.2em; }
.art-related li { margin-bottom: 6px; }
.art-back { margin-top: 28px; }
</style>
</head>
<body>
<div class="page">
  <div id="shell-banner" hidden></div>
  <div id="shell-header"></div>

  <section class="art-hero">
    <div class="container">
      <div class="breadcrumb">
        <a href="/">Altbieratlas</a>
        <span>&#x203A;</span>
        <a href="/magazin" data-i18n="mag.title">Altbier-Magazin</a>
        <span>&#x203A;</span>
        <span id="bc-title"></span>
      </div>
      <h1 class="art-title" id="art-title">&#x2026;</h1>
      <div class="art-meta" id="art-meta"></div>
      <p class="art-teaser" id="art-teaser" hidden></p>
    </div>
  </section>

  <main class="container art-main">
    <div class="art-body" id="art-body"></div>
    <aside class="art-related" id="art-related" hidden>
      <h2 data-i18n="mag.mentioned">Im Artikel erwähnt</h2>
      <ul id="art-related-list"></ul>
    </aside>
    <p class="art-back"><a href="/magazin" data-i18n="mag.back">← Alle Artikel</a></p>
  </main>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>
</div>

<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/data.js"></script>
<script src="/api-client.js"></script>
<script src="/shell.js"></script>
<script>
renderShell({ activeNav: "magazine" });

// Slug aus /magazin/<slug>; im Mock-Modus (Datei direkt geöffnet) aus ?id=
const postId = (() => {
  const m = location.pathname.match(/^\/magazin\/([^/]+)\/?$/);
  if (m) { try { return decodeURIComponent(m[1]); } catch { return null; } }
  return new URLSearchParams(location.search).get("id");
})();
let post = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function paint() {
  if (!post) return;
  const lang = window.__atlasLang || "de";
  const pick = (o) => (o && (o[lang] || o.de)) || "";
  const title = pick(post.title);
  document.title = title + " · Altbieratlas";
  document.getElementById("art-title").textContent = title;
  document.getElementById("bc-title").textContent = title;
  const meta = [`<time datetime="${esc(post.publishedAt)}">${esc(window.formatDateLong(post.publishedAt))}</time>`];
  if (post.updatedAt && post.updatedAt > post.publishedAt) {
    meta.push(`<span>· ${esc(window.t("mag.updated"))} ${esc(window.formatDateLong(post.updatedAt))}</span>`);
  }
  if (post.draft) meta.push(`<span class="art-draft">${esc(window.t("mag.draft"))}</span>`);
  document.getElementById("art-meta").innerHTML = meta.join(" ");
  const teaser = document.getElementById("art-teaser");
  teaser.textContent = pick(post.teaser);
  teaser.hidden = !teaser.textContent;
  // html ist serverseitig aus der Auszeichnung erzeugt und escaped (src/posts.js)
  document.getElementById("art-body").innerHTML = pick(post.html);
  const items = [
    ...(post.breweries || []).map((b) => `<li><a href="/ort/${encodeURIComponent(b.id)}">${esc(b.name)}</a>${b.city ? " · " + esc(b.city) : ""}</li>`),
    ...(post.events || []).map((e) => `<li><a href="/event?id=${encodeURIComponent(e.id)}">${esc(pick(e.title))}</a> · ${esc(window.formatDateLong(e.date))}</li>`),
  ];
  document.getElementById("art-related-list").innerHTML = items.join("");
  document.getElementById("art-related").hidden = !items.length;
}

(async () => {
  if (!postId) return;
  try {
    const r = await window.AtlasAPI.getPost(postId);
    if (!r || r.error || !r.post) throw new Error("not-found");
    post = r.post;
    paint();
    document.addEventListener("atlas:lang-changed", paint);
  } catch (e) {
    if (document.getElementById("art-body").innerHTML.trim()) return; // SSR-Inhalt behalten
    document.getElementById("art-title").textContent = window.t("mag.notFound");
  }
})();
</script>
</body>
</html>
