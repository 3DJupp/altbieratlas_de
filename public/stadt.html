<style>
/* Stadtseite: Kennzahl-Leiste und Orte als Getränkekarte (Design System „Altbieratlas“) */
.city-hero { padding: 48px 0 32px; border-bottom: 1px solid var(--rule-strong); }
.city-hero h1 { font-size: clamp(2rem, 4.5vw, 2.25rem); font-weight: 600; max-width: 24ch; margin: 0; }
.city-hero .lede { color: var(--ink-soft); font-size: 18px; max-width: 60ch; margin-top: 14px; line-height: 1.55; }

/* Kennzahl-Leiste: Werte durch Haarlinien getrennt, ohne Kacheln */
.stats-strip {
  display: grid; grid-template-columns: repeat(var(--stat-cols, 2), minmax(0, 1fr));
  margin: 24px 0 4px; max-width: 520px;
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule);
}
.stat { padding: 12px 16px; }
.stat:first-child { padding-left: 0; }
.stat + .stat { border-left: 1px solid var(--rule); }
.stat .label { font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.stat .val { font-family: var(--font-display); font-size: 26px; color: var(--ink); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.city-back { display: inline-block; margin-top: 20px; font-size: 14px; }

.city-section { padding: 48px 0; }
.city-section + .city-section { padding-top: 0; }
.city-section h2 { font-size: 1.625rem; font-weight: 600; margin-bottom: 16px; }

/* Orte als Zeilen: Name links, Punktlinie, Preis mit Größe rechts */
.city-grid { display: block; border-top: 1px solid var(--rule-strong); }
.city-card.menu-row { color: inherit; border-left: 0; border-right: 0; border-top: 0; }
.city-card.menu-row:hover .menu-name { text-decoration: underline; text-underline-offset: 3px; }
.city-card.historical .menu-name { color: var(--ink-soft); }
.city-empty { color: var(--ink-muted); padding: 16px 0; }

@media (max-width: 640px) {
  .city-card .menu-sub { display: none; }
}
</style>
</head>
<body>
<div class="page">
  <div id="shell-banner" hidden></div>
  <div id="shell-header"></div>

  <section class="city-hero">
    <div class="container">
      <h1 id="city-h1">Altbier in Düsseldorf</h1>
      <p class="lede" id="city-lede"></p>
      <div class="stats-strip" id="city-stats" hidden style="--stat-cols:2">
        <div class="stat"><div class="label" id="stat-count-lbl"></div><div class="val" id="stat-count">—</div></div>
        <div class="stat" id="stat-price-wrap" hidden><div class="label" id="stat-price-lbl"></div><div class="val" id="stat-price">—</div></div>
      </div>
      <a class="city-back" href="/" data-i18n="city.backToMap">← Zur Karte</a>
    </div>
  </section>

  <section class="city-section">
    <div class="container">
      <h2 id="city-current-title" data-i18n="city.current">Orte & Ausschank</h2>
      <div class="city-grid" id="city-venues" data-ssr="0">
        <p class="city-empty" data-i18n="common.loading">Lade…</p>
      </div>
    </div>
  </section>

  <section class="city-section" id="city-historical-section" hidden>
    <div class="container">
      <h2 data-i18n="city.historical">Historische Brauereien</h2>
      <div class="city-grid" id="city-historical"></div>
    </div>
  </section>

  <section class="city-section" id="city-other-section">
    <div class="container">
      <h2 data-i18n="city.other">Altbier anderswo</h2>
      <div class="city-links" id="city-other"></div>
    </div>
  </section>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>
</div>

<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/data.js"></script>
<script src="/api-client.js"></script>
<script src="/shell.js"></script>
<script>
renderShell({ activeNav: "" });

// Der Worker rendert die Seite serverseitig und hinterlegt die Stadt in
// <body data-city="…">. Ohne Backend (Mock-Modus) aus dem Slug ableiten.
const slug = (location.pathname.split("/")[2] || "duesseldorf").toLowerCase();
const SLUG_FALLBACK = { duesseldorf: "Düsseldorf", koeln: "Köln", krefeld: "Krefeld",
  neuss: "Neuss", moenchengladbach: "Mönchengladbach", hilden: "Hilden", bottrop: "Bottrop" };
const CITY = document.body.dataset.city
  || SLUG_FALLBACK[slug]
  || slug.replace(/(^|-)([a-z])/g, (m, a, b) => a + b.toUpperCase());
// Eigener Lede-Text nur für Düsseldorf; sonst rendert der Server ihn.
const ledeKey = slug === "duesseldorf" ? "city.lede.duesseldorf" : null;

let breweriesCache = null;
let pricesByBrewery = new Map();   // kleinste Größe je Ort: { price, size }
let quarterByBrewery = new Map();  // 0,25 l je Ort, nur für den Durchschnitt

const fillTpl = (key, vars) => {
  let s = window.t(key);
  for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
};

// Venue-Typ → lokalisiertes Label (gleiche Gruppen wie der Kartenfilter)
const TYPE_GROUP = {
  brewpub: "brauerei", brewery: "brauerei", taproom: "brauerei",
  pub: "gastronomie", restaurant: "gastronomie", gastronomie: "gastronomie",
  kiosk: "handel", supermarket: "handel", beverage_store: "handel", handel: "handel",
};
const typeLabel = (type) => {
  const g = TYPE_GROUP[type];
  return g ? window.t("map.filter." + g) : (type || "");
};

function paint() {
  const lang = window.__atlasLang;
  document.getElementById("city-h1").textContent = fillTpl("city.h1", { city: CITY });
  document.documentElement.lang = lang;
  document.title = window.atlasTitle(fillTpl("city.title", { city: CITY }));
  const ledeEl = document.getElementById("city-lede");
  if (ledeKey) ledeEl.textContent = window.t(ledeKey);

  if (!breweriesCache) return;
  // Ungeprüfte Orte („In Prüfung“) erscheinen nicht auf den Stadtseiten.
  const inCity = breweriesCache.filter((b) => b.verified && (b.city || "").toLowerCase() === CITY.toLowerCase());
  const current = inCity.filter((b) => !b.isHistorical);
  const historical = inCity.filter((b) => b.isHistorical);

  // Stats
  const statsEl = document.getElementById("city-stats");
  statsEl.hidden = false;
  document.getElementById("stat-count").textContent = inCity.length;
  document.getElementById("stat-count-lbl").textContent = window.t("city.stat.places");
  // Reine Brauereien schenken nicht aus und zählen im Durchschnitt nicht mit
  const prices = current.filter(window.atlasInComparisons)
    .map((b) => quarterByBrewery.get(b.id)).filter((x) => x != null);
  const priceWrap = document.getElementById("stat-price-wrap");
  if (prices.length) {
    const avg = prices.reduce((s, p) => s + p, 0) / prices.length;
    priceWrap.hidden = false;
    document.getElementById("stat-price").textContent = window.formatEuro(avg);
    document.getElementById("stat-price-lbl").textContent = window.t("city.stat.price");
    statsEl.style.setProperty("--stat-cols", "2");
  } else {
    priceWrap.hidden = true;
    statsEl.style.setProperty("--stat-cols", "1");
  }

  const card = (b) => {
    const p = pricesByBrewery.get(b.id);
    const hl = b.highlighted && !b.isHistorical;
    // Getränkekarten-Zeile: Name, Partner-Tag, Typ, Punktlinie, Größe, Preis
    return `<a class="city-card menu-row${b.isHistorical ? " historical" : ""}${hl ? " highlighted" : ""}" href="/ort/${encodeURIComponent(b.id)}">
      <span class="cc-name menu-name">${b.name}</span>
      ${hl ? `<span class="tag partner">${window.t("offer.partnerShort")}</span>` : ""}
      <span class="cc-type menu-sub">${typeLabel(b.type)}</span>
      <span class="menu-leader"></span>
      ${p ? `<span class="menu-size">${window.formatSize(p.size)}</span><span class="menu-price">${window.formatEuro(p.price)}</span>`
          : `<span class="menu-size">${window.t("city.noPrice")}</span>`}
    </a>`;
  };

  const cont = document.getElementById("city-venues");
  if (current.length) {
    // Hervorgehobene (gekennzeichnete) Partner zuerst, wie im SSR
    cont.innerHTML = [...current].sort((a, b) => !!b.highlighted - !!a.highlighted).map(card).join("");
    cont.dataset.ssr = "1";
  } else {
    cont.innerHTML = `<p class="city-empty">${fillTpl("city.empty", { city: CITY })} <a href="/beitragen?typ=ort">${window.t("city.contribute")}</a></p>`;
  }

  // Querverlinkung: der Server rendert sie vor; im Mock-Modus aus der Config.
  const otherEl = document.getElementById("city-other");
  if (otherEl && !otherEl.children.length) {
    const cities = (window.ATLAS_CONFIG.cities || []).filter((c) => c.slug !== slug);
    otherEl.innerHTML = cities
      .map((c) => `<a href="/stadt/${encodeURIComponent(c.slug)}">${fillTpl("city.h1", { city: c.city })}</a>`)
      .join("");
  }
  document.getElementById("city-other-section").hidden = !otherEl.children.length;

  const histSec = document.getElementById("city-historical-section");
  if (historical.length) {
    histSec.hidden = false;
    document.getElementById("city-historical").innerHTML = historical.map(card).join("");
  } else {
    histSec.hidden = true;
  }
}

(async () => {
  paint(); // Texte sofort (auch ohne Daten)
  try {
    const [brews, prices] = await Promise.all([
      window.AtlasAPI.listBreweries(),
      window.AtlasAPI.listPrices(),
    ]);
    breweriesCache = brews.breweries || [];
    // Je Ort: jüngster Preis der kleinsten gemeldeten Größe für die Karte,
    // jüngster 0,25-l-Preis für den Durchschnitt.
    // Größen stehen uneinheitlich als "0.25", "0,25" oder "0.25l" in der DB.
    const normSize = (v) => parseFloat(String(v ?? "").replace(",", ".").replace(/\s*l$/i, ""));
    const smallest = new Map();
    const quarter = new Map();
    (prices.prices || []).forEach((p) => {
      const size = normSize(p.size);
      if (isNaN(size)) return;
      const prev = smallest.get(p.breweryId);
      if (!prev || size < prev.size - 0.001 ||
          (Math.abs(size - prev.size) <= 0.001 && new Date(p.date) > new Date(prev.date))) {
        smallest.set(p.breweryId, { size, price: Number(p.price), date: p.date });
      }
      if (Math.abs(size - 0.25) <= 0.001) {
        const q = quarter.get(p.breweryId);
        if (!q || new Date(p.date) > new Date(q.date)) quarter.set(p.breweryId, p);
      }
    });
    smallest.forEach((p, id) => pricesByBrewery.set(id, p));
    quarter.forEach((p, id) => quarterByBrewery.set(id, Number(p.price)));
    paint();
  } catch (e) { /* SSR-/Mock-Inhalt bleibt stehen */ }
})();

document.addEventListener("atlas:lang-changed", paint);
</script>
</body>
</html>
