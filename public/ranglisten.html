<link rel="stylesheet" href="styles.css" />
<style>
.rank-hero { padding: 50px 0 20px; border-bottom: 1px solid var(--rule); }
.rank-hero h1 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 500; }
.rank-hero p { color: var(--ink-soft); max-width: 60ch; margin-top: 14px; }

.tab-bar {
  display: flex; gap: 4px;
  margin: 30px 0 0;
  border-bottom: 1px solid var(--rule);
  overflow-x: auto;
}
.tab-bar button {
  background: transparent; border: none;
  color: var(--ink-soft); font-family: var(--font-ui);
  font-size: 14px; padding: 12px 16px;
  cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab-bar button.active { color: var(--ink); border-bottom-color: var(--copper); }

.pill-toggle {
  display: inline-flex; gap: 4px; padding: 4px;
  background: var(--bg-card); border: 1px solid var(--rule);
  border-radius: 999px;
}
.pill-toggle button {
  background: transparent; border: none;
  padding: 6px 12px; font-family: var(--font-mono);
  font-size: 12px; color: var(--ink-soft);
  cursor: pointer; border-radius: 999px;
}
.pill-toggle button.active { background: var(--accent); color: var(--accent-ink); }

.rank-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px; padding: 12px 18px;
  align-items: center;
  border-bottom: 1px solid var(--rule);
}
.rank-row.head {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-muted);
}
.rank-row .nm { font-weight: 500; }
.rank-row .nm a { border: none; }
.rank-row .nm .sub { font-size: 12px; color: var(--ink-muted); font-weight: 400; margin-top: 2px; }
.pr-cell { text-align: right; }
.pr-cell .pr { font-family: var(--font-mono); color: var(--copper); font-weight: 500; font-size: 16px; display: block; }
.pr-cell .dt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); display: block; margin-top: 2px; }

.rank-table { padding: 30px 0 80px; }
.rank-card-full { background: var(--bg-card); border: 1px solid var(--rule); border-radius: var(--radius-lg); overflow: hidden; }
.rank-head-full {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap; gap: 12px;
}
.rank-head-full h2 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 500; }

.stats-strip {
  display: grid; grid-template-columns: repeat(var(--stat-cols, 4), 1fr);
  gap: 20px; margin: 28px 0 10px;
}
.stat {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
}
.stat .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
.stat .val { font-family: var(--font-display); font-size: 32px; color: var(--copper); font-weight: 500; margin-top: 4px; letter-spacing: -0.02em; }
.stat .meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

@media (max-width: 800px) {
  .stats-strip { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="page">
  <div id="shell-banner" hidden></div>
  <div id="shell-header"></div>

  <section class="rank-hero">
    <div class="container">
      <div class="eyebrow" data-i18n="nav.rankings">Ranglisten</div>
      <h1 data-i18n="rank.heroTitle">Wo Alt am günstigsten, wo es am teuersten ist</h1>
      <p><span data-i18n="rank.heroPrelude">Alle Preise stammen aus Community-Meldungen. Nur die jüngste Meldung pro Brauerei zählt. Werte können veralten — </span><a href="/beitragen?typ=preis" data-i18n="rank.heroPreludeLink">melde einen aktuellen Preis</a>.</p>

      <div class="stats-strip" id="stats-strip">
        <!-- Preis-Durchschnittskästen werden dynamisch von renderStats() eingefügt -->
        <div class="stat"><div class="label" data-i18n="rank.statBreweries">Brauereien</div><div class="val" id="st-br">—</div><div class="meta" data-i18n="rank.statMetaInAtlas">im Atlas</div></div>
        <div class="stat"><div class="label" data-i18n="rank.statPrices">Preismeldungen</div><div class="val" id="st-pr">—</div><div class="meta" data-i18n="rank.statMetaTotal">gesamt</div></div>
      </div>
    </div>
  </section>

  <section class="rank-table">
    <div class="container">
      <div class="tab-bar">
        <button data-tab="prices" class="active" data-i18n="rank.tabPrices">Preise</button>
        <button data-tab="most" data-i18n="rank.tabMost">Meistgemeldet</button>
        <button data-tab="newest" data-i18n="rank.tabNewest">Neu auf dem Atlas</button>
      </div>
      <div id="controls-row" style="display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap">
        <div class="pill-toggle" id="sort-toggle">
          <button data-dir="asc" class="active"></button>
          <button data-dir="desc"></button>
        </div>
        <div class="pill-toggle" id="size-toggle">
          <!-- wird von initSizeToggle() befüllt -->
        </div>
      </div>

      <div class="rank-card-full" style="margin-top:20px">
        <div class="rank-head-full">
          <h2 id="rank-title" data-i18n="rank.tabPrices">Preise</h2>
          <div style="font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)" id="rank-meta">— <span data-i18n="rank.entries">Einträge</span></div>
        </div>
        <div class="rank-row head">
          <span data-i18n="rank.colBrewery">Brauerei</span>
          <span style="text-align:right" data-i18n="rank.colPrice">Preis</span>
        </div>
        <div id="rank-body">
          <p style="color:var(--ink-muted);padding:20px" data-i18n="common.loading">Lade…</p>
        </div>
      </div>
    </div>
  </section>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>
</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="api-client.js"></script>
<script src="shell.js"></script>
<script>
renderShell({ activeNav: "rankings" });

let breweries = [];
let prices = [];
const breweryById = new Map();

// Normalisiert Größenangaben: "0,25l", "0.25l", "0.25" → 0.25
function normSize(s) {
  return parseFloat(String(s).replace(",", ".").replace(/\s*l$/i, ""));
}

// Alle konfigurierten Größen (für Stats, Durchschnitt etc.)
function configSizes() {
  return window.ATLAS_CONFIG.priceSizes || [0.2, 0.25, 0.4, 0.5];
}

// Hervorgehobene Größen — erscheinen als eigene Buttons im Toggle
function highlightedSizes() {
  const hl = window.ATLAS_CONFIG.highlightedSizes || [];
  return hl.length > 0 ? hl : configSizes();
}

// Gehört eine Größe zu den hervorgehobenen Größen?
// Nicht-hervorgehobene Größen landen in "Andere".
function isConfigSize(num) {
  return highlightedSizes().some((c) => Math.abs(c - num) < 0.001);
}

function avgPrice(sizeNum) {
  const xs = prices.filter((p) => Math.abs(normSize(p.size) - sizeNum) < 0.001);
  return xs.length ? xs.reduce((a, b) => a + b.price, 0) / xs.length : 0;
}

function renderStats() {
  const strip = document.getElementById("stats-strip");
  const hl = window.ATLAS_CONFIG.highlightedSizes || [];

  // Vorherige Preis-Kästen entfernen, dann neu einfügen
  strip.querySelectorAll(".stat-price-avg").forEach((el) => el.remove());
  const firstCountBox = strip.querySelector(".stat");
  const metaLabel = window.t ? window.t("rank.statMetaAll") : "über alle Meldungen";
  hl.forEach((sizeNum) => {
    const box = document.createElement("div");
    box.className = "stat stat-price-avg";
    box.innerHTML =
      `<div class="label">Ø ${window.formatSize(String(sizeNum))}</div>` +
      `<div class="val">€ ${window.formatPrice(avgPrice(sizeNum))}</div>` +
      `<div class="meta">${metaLabel}</div>`;
    strip.insertBefore(box, firstCountBox);
  });

  // Grid-Spalten: n Preiskästen + 2 Zählkästen
  strip.style.setProperty("--stat-cols", hl.length + 2);
}

let currentTab = "prices";
let currentSize = null; // wird von initSizeToggle gesetzt (Zahl oder null für "Andere")
let currentDir = "asc";

function initSizeToggle(sizes) {
  const toggle = document.getElementById("size-toggle");
  const otherLabel = window.__atlasLang === "en" ? "Other" : "Andere";
  const defaultSize = sizes[0];
  toggle.innerHTML =
    sizes.map((n) =>
      `<button data-size="${n}"${Math.abs(n - defaultSize) < 0.001 ? ' class="active"' : ''}>${window.formatSize(String(n))}</button>`
    ).join("") +
    `<button data-size="other">${otherLabel}</button>`;

  if (currentSize === null) currentSize = defaultSize;

  toggle.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      toggle.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      currentSize = b.dataset.size === "other" ? null : parseFloat(b.dataset.size);
      render();
    });
  });
}

(async () => {
  try {
    const [b, p, cfg] = await Promise.all([
      window.AtlasAPI.listBreweries(),
      window.AtlasAPI.listPrices(),
      window.AtlasAPI.getConfig().catch(() => null),
    ]);
    breweries = b.breweries || [];
    prices = p.prices || [];
    breweries.forEach((br) => breweryById.set(br.id, br));

    // Config-Werte übernehmen (mergeServerConfig hat sie bereits via probe() gesetzt,
    // diese Zuweisung dient als Sicherheitsnetz falls probe noch nicht abgeschlossen war)
    if (cfg?.priceSizes?.length)              window.ATLAS_CONFIG.priceSizes      = cfg.priceSizes;
    if (Array.isArray(cfg?.highlightedSizes)) window.ATLAS_CONFIG.highlightedSizes = cfg.highlightedSizes;

    initSizeToggle(highlightedSizes());
    updateToggleLabels();
    renderStats();
    document.getElementById("st-br").textContent = breweries.length;
    document.getElementById("st-pr").textContent = prices.length;

    render();
  } catch (e) {
    console.error(e);
    document.getElementById("rank-body").innerHTML =
      `<p style="color:#9b1f1f;padding:20px">${window.t("rank.loadError")}</p>`;
  }
})();

function monthYear(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  return String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
}

function updateToggleLabels() {
  document.querySelectorAll("#size-toggle button").forEach((btn) => {
    const s = btn.dataset.size;
    btn.textContent = s === "other"
      ? (window.__atlasLang === "en" ? "Other" : "Andere")
      : window.formatSize(s);
  });
  const t = window.t;
  const asc = document.querySelector("#sort-toggle [data-dir='asc']");
  const desc = document.querySelector("#sort-toggle [data-dir='desc']");
  if (asc) asc.textContent = t("rank.sortAsc");
  if (desc) desc.textContent = t("rank.sortDesc");
}

function updateControls() {
  document.getElementById("controls-row").style.display =
    currentTab === "prices" ? "flex" : "none";
}

// sizeNum = Zahl (z. B. 0.25) oder null für "Andere" (nicht in configSizes)
function latestPerBrewery(sizeNum) {
  const map = {};
  const filtered = sizeNum !== null
    ? prices.filter((p) => Math.abs(normSize(p.size) - sizeNum) < 0.001)
    : prices.filter((p) => !isConfigSize(normSize(p.size)));
  filtered.slice().sort((a, b) => b.date.localeCompare(a.date))
    .forEach((p) => { if (!map[p.breweryId]) map[p.breweryId] = p; });
  return Object.values(map)
    .map((p) => { const b = breweryById.get(p.breweryId); return b ? { ...p, brewery: b } : null; })
    .filter(Boolean);
}

function countPerBrewery() {
  const map = {};
  prices.forEach((p) => { map[p.breweryId] = (map[p.breweryId] || 0) + 1; });
  return Object.entries(map)
    .map(([bid, n]) => ({ brewery: breweryById.get(bid), n }))
    .filter((x) => x.brewery);
}

function render() {
  const body = document.getElementById("rank-body");
  const t = window.t;
  let list = [];
  let title = "";

  if (currentTab === "prices") {
    list = latestPerBrewery(currentSize);
    list = currentDir === "asc"
      ? list.sort((a, b) => a.price - b.price)
      : list.sort((a, b) => b.price - a.price);
    const sizeLabel = currentSize !== null
      ? window.formatSize(String(currentSize))
      : (window.__atlasLang === "en" ? "Other" : "Andere");
    title = t(currentDir === "asc" ? "rank.titleCheapest" : "rank.titlePriciest") + sizeLabel;
  } else if (currentTab === "most") {
    list = countPerBrewery().sort((a, b) => b.n - a.n).map((x) => ({
      brewery: x.brewery, price: null, date: null, size: null, count: x.n,
    }));
    title = t("rank.titleMost");
  } else if (currentTab === "newest") {
    const seen = new Set();
    prices.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((p) => {
      if (seen.has(p.breweryId)) return;
      seen.add(p.breweryId);
      const br = breweryById.get(p.breweryId);
      if (br) list.push({ ...p, brewery: br });
    });
    title = t("rank.titleNewest");
  }

  document.getElementById("rank-title").textContent = title;
  document.getElementById("rank-title").removeAttribute("data-i18n");
  document.getElementById("rank-meta").innerHTML = Math.min(list.length, 10) + " <span>" + t("rank.entries") + "</span>";

  body.innerHTML = list.slice(0, 10).map((it) => {
    const priceDisplay = it.price != null
      ? "€ " + window.formatPrice(it.price)
      : (it.count ? "×" + it.count : "—");
    const dateDisplay = it.date ? monthYear(it.date) : "";
    const city = it.brewery.city || "";
    const type = t("type." + it.brewery.type);
    // Bei "Andere"-Ansicht die tatsächliche Größe in der Zeile zeigen
    const sizeHint = currentSize === null && it.size ? window.formatSize(String(normSize(it.size))) : "";
    const sub = [type, city, sizeHint].filter(Boolean).join(" · ");
    // Bei "Neu auf dem Atlas": Größe und Datum kombiniert anzeigen
    const sizeLabel = currentTab === "newest" && it.size ? window.formatSize(String(normSize(it.size))) : "";
    const metaDisplay = [sizeLabel, dateDisplay].filter(Boolean).join(" · ");
    return `
      <div class="rank-row">
        <span class="nm">
          <a href="/ort?id=${it.brewery.id}">${it.brewery.name}</a>
          <div class="sub">${sub}</div>
        </span>
        <span class="pr-cell">
          <span class="pr">${priceDisplay}</span>
          ${metaDisplay ? `<span class="dt">${metaDisplay}</span>` : ""}
        </span>
      </div>
    `;
  }).join("") || `<p style="color:var(--ink-muted);padding:20px">${t("rank.noEntries")}</p>`;
}

document.querySelectorAll(".tab-bar button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab-bar button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    currentTab = b.dataset.tab;
    updateControls();
    render();
  });
});

document.querySelectorAll("#sort-toggle button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#sort-toggle button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    currentDir = b.dataset.dir;
    render();
  });
});

document.addEventListener("atlas:lang-changed", () => {
  updateToggleLabels();
  if (breweries.length) { renderStats(); render(); }
});

// Sort-toggle-Labels sofort setzen (Größen-Toggle wird nach Datenladen befüllt)
updateToggleLabels();
</script>
</body>
</html>
