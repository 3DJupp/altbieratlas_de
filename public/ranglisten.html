.rank-hero { padding: 50px 0 20px; border-bottom: 1px solid var(--rule); }
.rank-hero h1 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 500; }
.rank-hero p { color: var(--ink-soft); max-width: 60ch; margin-top: 14px; }

.tab-bar {
  display: flex; gap: 4px;
  margin: 30px 0 0;
  border-bottom: 1px solid var(--rule);
  overflow-x: auto;
}
.tab-bar button {
  background: transparent; border: none;
  color: var(--ink-soft); font-family: var(--font-ui);
  font-size: 14px; padding: 12px 16px;
  cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab-bar button.active { color: var(--ink); border-bottom-color: var(--copper); }

.pill-toggle {
  display: inline-flex; gap: 4px; padding: 4px;
  background: var(--bg-card); border: 1px solid var(--rule);
  border-radius: 999px;
}
.pill-toggle button {
  background: transparent; border: none;
  padding: 6px 12px; font-family: var(--font-ui); font-variant-numeric: tabular-nums;
  font-size: 12px; color: var(--ink-soft);
  cursor: pointer; border-radius: 999px;
}
.pill-toggle button.active { background: var(--accent); color: var(--accent-ink); }
.style-filter {
  background: var(--bg-card); border: 1px solid var(--rule);
  border-radius: 999px; padding: 8px 14px;
  font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft);
  max-width: 100%;
}

  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px; padding: 12px 18px;

.pr-cell .pr { font-family: var(--font-ui); font-variant-numeric: tabular-nums; color: var(--copper); font-weight: 500; font-size: 16px; display: block; }
.pr-cell .dt { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--ink-muted); display: block; margin-top: 2px; }

.rank-table { padding: 30px 0 80px; }
.rank-foot { font-size: 12px; color: var(--ink-muted); margin-top: 12px; }
.wanted-link { font-size: 13px; white-space: nowrap; }
.rank-card-full { background: var(--bg-card); border: 1px solid var(--rule); border-radius: var(--radius-lg); overflow: hidden; }
.rank-head-full {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap; gap: 12px;
}
.rank-head-full h2 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 500; }

.stats-strip {
  display: grid; grid-template-columns: repeat(var(--stat-cols, 4), 1fr);
  gap: 20px; margin: 28px 0 10px;
}
.stat {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);

}
.stat .label { font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }

@media (max-width: 800px) {

  <section class="rank-hero">

      <div class="stats-strip" id="stats-strip">

        <button data-tab="most" data-i18n="rank.tabMost">Meistgemeldet</button>
        <button data-tab="newest" data-i18n="rank.tabNewest">Neu auf dem Atlas</button>
        <button data-tab="google" data-i18n="rank.tabGoogle">Google-Bewertung</button>
        <button data-tab="wanted" data-i18n="rank.tabWanted">Preis gesucht</button>
      </div>
      <div id="controls-row" style="display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap">

          <button data-dir="asc" class="active"></button>
          <button data-dir="desc"></button>

          <!-- wird von initSizeToggle() befüllt -->
        </div>
        <select class="style-filter" id="style-filter" aria-label="Sorte">
          <!-- wird von initStyleFilter() befüllt -->

      <div class="rank-card-full" style="margin-top:20px">
        <div class="rank-head-full">
          <h2 id="rank-title" data-i18n="rank.tabPrices">Preise</h2>
          <div style="font-size:12px;color:var(--ink-muted);font-family:var(--font-ui);font-variant-numeric:tabular-nums" id="rank-meta">— <span data-i18n="rank.entries">Einträge</span></div>
        </div>
        <div class="rank-row head">
          <span data-i18n="rank.colBrewery">Brauerei</span>
          <span style="text-align:right" id="rank-col" data-i18n="rank.colPrice">Preis</span>
        </div>

  </section>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>

<script>
renderShell({ activeNav: "rankings" });

// Mindestanzahl Google-Bewertungen für die Rangliste
const GOOGLE_MIN_COUNT = 25;
let breweries = [];
let prices = [];
const breweryById = new Map();
const styleById = new Map();

// Normalisiert Größenangaben: "0,25l", "0.25l", "0.25" → 0.25
function normSize(s) {
  return parseFloat(String(s).replace(",", ".").replace(/\s*l$/i, ""));
}

// Alle konfigurierten Größen (für Stats, Durchschnitt etc.)
function configSizes() {
  return window.ATLAS_CONFIG.priceSizes || [0.2, 0.25, 0.4, 0.5];
}

// Hervorgehobene Größen — erscheinen als eigene Buttons im Toggle
function highlightedSizes() {
  const hl = window.ATLAS_CONFIG.highlightedSizes || [];
  return hl.length > 0 ? hl : configSizes();
}

// Gehört eine Größe zu den konfigurierten Größen?
// Größen außerhalb der konfigurierten Liste landen in "Andere".
function isConfigSize(num) {
  return configSizes().some((c) => Math.abs(c - num) < 0.001);
}

// Reine Brauereien schenken nicht aus und zählen im Durchschnitt nicht mit
function avgPrice(sizeNum) {
  const xs = prices.filter((p) => Math.abs(normSize(p.size) - sizeNum) < 0.001
    && window.atlasInComparisons(breweryById.get(p.breweryId)));
  return xs.length ? xs.reduce((a, b) => a + b.price, 0) / xs.length : 0;
}

function renderStats() {
  const strip = document.getElementById("stats-strip");
  // Ø-Preis je konfigurierter Größe, die auch Meldungen hat (keine leeren Kacheln)
  const sizes = configSizes().filter((s) => avgPrice(s) > 0);

  // Vorherige Preis-Kästen entfernen, dann neu einfügen
  strip.querySelectorAll(".stat-price-avg").forEach((el) => el.remove());
  const firstCountBox = strip.querySelector(".stat");
  const metaLabel = window.t ? window.t("rank.statMetaAll") : "über alle Meldungen";
  sizes.forEach((sizeNum) => {
    const box = document.createElement("div");
    box.className = "stat stat-price-avg";
    box.innerHTML =
      `<div class="label">Ø ${window.formatSize(String(sizeNum))}</div>` +
      `<div class="val">€ ${window.formatPrice(avgPrice(sizeNum))}</div>` +
      `<div class="meta">${metaLabel}</div>`;
    strip.insertBefore(box, firstCountBox);
  });

  // Grid-Spalten: n Preiskästen + 2 Zählkästen
  strip.style.setProperty("--stat-cols", sizes.length + 2);
}

let currentTab = "prices";
let currentSize = null; // wird von initSizeToggle gesetzt (Zahl oder null für "Andere")
let currentDir = "asc";
let currentStyle = ""; // "" = alle Sorten, sonst Sorten-ID

function initSizeToggle(sizes) {
  const toggle = document.getElementById("size-toggle");
  const otherLabel = window.__atlasLang === "en" ? "Other" : "Andere";
  // Voreingestellte Größe: erste hervorgehobene Größe (z. B. 0,25 l), sonst die erste
  const hl = highlightedSizes();
  const defaultSize = sizes.find((n) => hl.some((h) => Math.abs(h - n) < 0.001)) ?? sizes[0];
  toggle.innerHTML =
    sizes.map((n) =>
      `<button data-size="${n}"${Math.abs(n - defaultSize) < 0.001 ? ' class="active"' : ''}>${window.formatSize(String(n))}</button>`
    ).join("") +
    `<button data-size="other">${otherLabel}</button>`;

  if (currentSize === null) currentSize = defaultSize;

  toggle.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      toggle.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      currentSize = b.dataset.size === "other" ? null : parseFloat(b.dataset.size);
      render();
    });
  });
}

// Sortenfilter: nur Sorten, zu denen es Preismeldungen gibt
function initStyleFilter() {
  const sel = document.getElementById("style-filter");
  const withPrices = new Set(prices.map((p) => p.styleId).filter(Boolean));
  const opts = [...styleById.values()]
    .filter((s) => withPrices.has(s.id))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));
  sel.innerHTML = `<option value="">${window.t("rank.allStyles")}</option>` +
    opts.map((s) => `<option value="${escAttr(s.id)}">${escAttr(s.name)}</option>`).join("");
  sel.value = currentStyle;
  sel.setAttribute("aria-label", window.t("field.style"));
}

function escAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

document.getElementById("style-filter").addEventListener("change", (e) => {
  currentStyle = e.target.value;
  render();
});

(async () => {
  try {
    const [b, p, cfg, st] = await Promise.all([
      window.AtlasAPI.listBreweries(),
      window.AtlasAPI.listPrices(),
      window.AtlasAPI.getConfig().catch(() => null),
      window.AtlasAPI.listStyles().catch(() => ({ styles: [] })),
    ]);
    breweries = b.breweries || [];
    prices = p.prices || [];
    breweries.forEach((br) => breweryById.set(br.id, br));
    (st.styles || []).forEach((s) => styleById.set(s.id, s));

    // Config-Werte übernehmen (mergeServerConfig hat sie bereits via probe() gesetzt,
    // diese Zuweisung dient als Sicherheitsnetz falls probe noch nicht abgeschlossen war)
    if (cfg?.priceSizes?.length)              window.ATLAS_CONFIG.priceSizes      = cfg.priceSizes;
    if (Array.isArray(cfg?.highlightedSizes)) window.ATLAS_CONFIG.highlightedSizes = cfg.highlightedSizes;

    initSizeToggle(configSizes());
    initStyleFilter();
    updateToggleLabels();
    renderStats();
    document.getElementById("st-br").textContent = breweries.length;
    document.getElementById("st-pr").textContent = prices.length;

    render();
  } catch (e) {
    console.error(e);
    document.getElementById("rank-body").innerHTML =
      `<p style="color:#9b1f1f;padding:20px">${window.t("rank.loadError")}</p>`;
  }
})();

function monthYear(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  return String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
}

function updateToggleLabels() {
  document.querySelectorAll("#size-toggle button").forEach((btn) => {
    const s = btn.dataset.size;
    btn.textContent = s === "other"
      ? (window.__atlasLang === "en" ? "Other" : "Andere")
      : window.formatSize(s);
  });
  const t = window.t;
  const asc = document.querySelector("#sort-toggle [data-dir='asc']");
  const desc = document.querySelector("#sort-toggle [data-dir='desc']");
  if (asc) asc.textContent = t("rank.sortAsc");
  if (desc) desc.textContent = t("rank.sortDesc");
}

function updateControls() {
  document.getElementById("controls-row").style.display =
    currentTab === "prices" ? "flex" : "none";
}

// sizeNum = Zahl (z. B. 0.25) oder null für "Andere" (nicht in configSizes).
// Jüngste Meldung je Ort und Sorte: führt ein Ort mehrere Alts, erscheint jedes.
function latestPerBrewery(sizeNum) {
  const map = {};
  let filtered = sizeNum !== null
    ? prices.filter((p) => Math.abs(normSize(p.size) - sizeNum) < 0.001)
    : prices.filter((p) => !isConfigSize(normSize(p.size)));
  if (currentStyle) filtered = filtered.filter((p) => p.styleId === currentStyle);
  // Eine Meldung ohne Sorte verdrängt ältere Meldungen derselben Größe und wird
  // umgekehrt von neueren verdrängt (wie sameSlot() im Worker).
  filtered.slice().sort((a, b) => b.date.localeCompare(a.date))
    .forEach((p) => {
      const list = (map[p.breweryId] ||= []);
      const n = normSize(p.size);
      const taken = list.some((x) => Math.abs(normSize(x.size) - n) < 0.001
        && (!x.styleId || !p.styleId || x.styleId === p.styleId));
      if (!taken) list.push(p);
    });
  return Object.values(map).flat()
    .map((p) => { const b = breweryById.get(p.breweryId); return window.atlasInComparisons(b) ? { ...p, brewery: b } : null; })
    .filter(Boolean);
}

function countPerBrewery() {
  const map = {};
  prices.forEach((p) => { map[p.breweryId] = (map[p.breweryId] || 0) + 1; });
  return Object.entries(map)
    .map(([bid, n]) => ({ brewery: breweryById.get(bid), n }))
    .filter((x) => window.atlasInComparisons(x.brewery));
}

function render() {
  const body = document.getElementById("rank-body");
  const t = window.t;
  let list = [];
  let title = "";

  if (currentTab === "prices") {
    list = latestPerBrewery(currentSize);
    list = currentDir === "asc"
      ? list.sort((a, b) => a.price - b.price)
      : list.sort((a, b) => b.price - a.price);
    const sizeLabel = currentSize !== null
      ? window.formatSize(String(currentSize))
      : (window.__atlasLang === "en" ? "Other" : "Andere");
    title = t(currentDir === "asc" ? "rank.titleCheapest" : "rank.titlePriciest") + sizeLabel;
    if (currentStyle && styleById.has(currentStyle)) title += " · " + styleById.get(currentStyle).name;
  } else if (currentTab === "most") {
    list = countPerBrewery().sort((a, b) => b.n - a.n).map((x) => ({
      brewery: x.brewery, price: null, date: null, size: null, count: x.n,
    }));
    title = t("rank.titleMost");
  } else if (currentTab === "google") {
    // Nur Orte mit genug Bewertungen, sonst führen Ein-Stern-Ausreißer die Liste an
    list = breweries
      .filter((br) => !br.isHistorical && window.atlasInComparisons(br) && br.googleRating?.rating != null
        && (br.googleRating.userRatingCount || 0) >= GOOGLE_MIN_COUNT)
      .sort((a, b) => b.googleRating.rating - a.googleRating.rating
        || b.googleRating.userRatingCount - a.googleRating.userRatingCount)
      .map((br) => ({ brewery: br, rating: br.googleRating }));
    title = t("rank.titleGoogle");
  } else if (currentTab === "wanted") {
    // Aktive Orte ohne jede Preismeldung, nach Stadt und Name
    const withPrice = new Set(prices.map((p) => p.breweryId));
    list = breweries
      .filter((br) => !br.isHistorical && window.atlasInComparisons(br) && !withPrice.has(br.id))
      .sort((a, b) => (a.city || "").localeCompare(b.city || "") || a.name.localeCompare(b.name))
      .map((br) => ({ brewery: br }));
    title = t("rank.titleWanted");
  } else if (currentTab === "newest") {
    // Nach Eintragung (created_at) sortieren und dieses Datum zeigen; Mock-Daten
    // haben kein createdAt → Preisdatum als Ersatz.
    const seen = new Set();
    prices.slice().sort((a, b) =>
      (b.createdAt || b.date).localeCompare(a.createdAt || a.date) || b.date.localeCompare(a.date)
    ).forEach((p) => {
      if (seen.has(p.breweryId)) return;
      seen.add(p.breweryId);
      const br = breweryById.get(p.breweryId);
      if (br) list.push({ ...p, date: (p.createdAt || p.date).slice(0, 10), brewery: br });
    });
    title = t("rank.titleNewest");
  }

  document.getElementById("rank-title").textContent = title;
  document.getElementById("rank-title").removeAttribute("data-i18n");
  // „Preis gesucht“ zeigt alle offenen Orte, die anderen Listen die ersten zehn
  const limit = currentTab === "wanted" ? list.length : 10;
  document.getElementById("rank-meta").innerHTML = Math.min(list.length, limit) + " <span>" + t("rank.entries") + "</span>";
  const col = document.getElementById("rank-col");
  col.removeAttribute("data-i18n");
  col.textContent = t(currentTab === "google" ? "rank.colRating" : currentTab === "wanted" ? "rank.colWanted" : "rank.colPrice");
  const loc = window.__atlasLang === "en" ? "en-GB" : "de-DE";

  body.innerHTML = list.slice(0, limit).map((it) => {
    if (it.rating) {
      const r = Number(it.rating.rating).toLocaleString(loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const n = Number(it.rating.userRatingCount).toLocaleString(loc);
      const sub = [t("type." + it.brewery.type), it.brewery.city].filter(Boolean).join(" · ");
      return `
      <div class="rank-row">
        <span class="nm">
          <a href="/ort/${encodeURIComponent(it.brewery.id)}">${it.brewery.name}</a>
          <div class="sub">${sub}</div>
        </span>
        <span class="pr-cell">
          <span class="pr">${r} ★</span>
          <span class="dt">${n} ${t("brewery.googleRatingCount")}</span>
        </span>
      </div>`;
    }
    if (currentTab === "wanted") {
      const sub = [t("type." + it.brewery.type), it.brewery.city].filter(Boolean).join(" · ");
      return `
      <div class="rank-row">
        <span class="nm">
          <a href="/ort/${encodeURIComponent(it.brewery.id)}">${it.brewery.name}</a>
          <div class="sub">${sub}</div>
        </span>
        <span class="pr-cell">
          <a class="wanted-link" href="/beitragen?typ=preis&brauerei=${encodeURIComponent(it.brewery.id)}">${t("brewery.addPrice")} →</a>
        </span>
      </div>`;
    }
    const priceDisplay = it.price != null
      ? "€ " + window.formatPrice(it.price)
      : (it.count ? "×" + it.count : "—");
    const dateDisplay = it.date ? monthYear(it.date) : "";
    const city = it.brewery.city || "";
    const type = t("type." + it.brewery.type);
    // Bei "Andere"-Ansicht die tatsächliche Größe in der Zeile zeigen
    const sizeHint = currentSize === null && it.size ? window.formatSize(String(normSize(it.size))) : "";
    // Sorte nennen, außer der Filter steht schon auf genau dieser Sorte
    const styleHint = it.styleId && it.styleId !== currentStyle ? (styleById.get(it.styleId)?.name || "") : "";
    const sub = [type, city, sizeHint, styleHint].filter(Boolean).join(" · ");
    // Bei "Neu auf dem Atlas": Größe und Datum kombiniert anzeigen
    const sizeLabel = currentTab === "newest" && it.size ? window.formatSize(String(normSize(it.size))) : "";
    const metaDisplay = [sizeLabel, dateDisplay].filter(Boolean).join(" · ");
    return `
      <div class="rank-row">
        <span class="nm">
          <a href="/ort/${encodeURIComponent(it.brewery.id)}">${it.brewery.name}</a>
          <div class="sub">${sub}</div>
        </span>
        <span class="pr-cell">
          <span class="pr">${priceDisplay}</span>
          ${metaDisplay ? `<span class="dt">${metaDisplay}</span>` : ""}
        </span>
      </div>
    `;
  }).join("") || `<p style="color:var(--ink-muted);padding:20px">${t("rank.noEntries")}</p>`;
  const note = document.getElementById("rank-foot");
  note.hidden = !(currentTab === "google" || currentTab === "wanted");
  note.textContent = currentTab === "google"
    ? t("rank.googleNote").replace("{n}", GOOGLE_MIN_COUNT)
    : t("rank.wantedNote");
}

document.querySelectorAll(".tab-bar button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab-bar button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    currentTab = b.dataset.tab;
    updateControls();
    render();
  });
});

document.querySelectorAll("#sort-toggle button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#sort-toggle button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    currentDir = b.dataset.dir;
    render();
  });
});

document.addEventListener("atlas:lang-changed", () => {
  updateToggleLabels();
  if (styleById.size) initStyleFilter();
  if (breweries.length) { renderStats(); render(); }
});

// Sort-toggle-Labels sofort setzen (Größen-Toggle wird nach Datenladen befüllt)
updateToggleLabels();
</script>
</body>
</html>
