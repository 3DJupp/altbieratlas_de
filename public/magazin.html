<style>
.mag-hero { padding: 60px 0 32px; border-bottom: 1px solid var(--rule); }
.mag-hero h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 500; }
.mag-hero .lede { color: var(--ink-soft); font-size: 18px; max-width: 60ch; margin-top: 14px; line-height: 1.65; }
.mag-main { padding-top: 24px; padding-bottom: 60px; }
</style>

<body>
<div class="page">
  <div id="shell-banner" hidden></div>
  <div id="shell-header"></div>

  <section class="mag-hero">
    <div class="container">
      <h1 data-i18n="mag.title">Altbier-Magazin</h1>
      <p class="lede" data-i18n="mag.lede">Was sich in der Altbier-Welt tut: Sonderbiere und Saison, neue und geschlossene Brauhäuser und was die Preisdaten im Atlas verraten.</p>
    </div>
  </section>

  <main class="container mag-main">
    <ul class="mag-list" id="mag-list"></ul>
    <p id="mag-empty" style="color:var(--ink-muted)" hidden data-i18n="mag.empty">Noch keine Artikel.</p>
  </main>

  <div id="shell-footer"></div>
  <div id="shell-cookie"></div>
</div>

<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script src="/data.js"></script>
<script src="/api-client.js"></script>
<script src="/shell.js"></script>
<script>
renderShell({ activeNav: "magazine" });

let magPosts = null;
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function paintPosts() {
  if (!magPosts) return;
  const lang = window.__atlasLang || "de";
  document.getElementById("mag-list").innerHTML = magPosts.map((p) => `
    <li class="mag-item"><a href="/magazin/${encodeURIComponent(p.id)}">
      <span class="mag-date">${esc(window.formatDateLong(p.publishedAt))}</span>
      <span class="mag-title">${esc(p.title[lang] || p.title.de)}</span>
      ${(p.teaser[lang] || p.teaser.de) ? `<span class="mag-teaser">${esc(p.teaser[lang] || p.teaser.de)}</span>` : ""}
    </a></li>`).join("");
  document.getElementById("mag-empty").hidden = magPosts.length > 0;
}
(async () => {
  try {
    magPosts = (await window.AtlasAPI.listPosts()).posts || [];
    paintPosts();
  } catch (e) {
    console.error("[magazin]", e);
  }
})();
document.addEventListener("atlas:lang-changed", paintPosts);
</script>
</body>
